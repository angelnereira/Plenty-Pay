<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B31FF">
  <title>Sin conexión - PlentyPay</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --primary: #8B31FF;
      --primary-light: #A855F7;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    
    .container {
      max-width: 400px;
      width: 100%;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(139, 49, 255, 0.3);
    }
    
    .icon svg {
      width: 64px;
      height: 64px;
      color: white;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(139, 49, 255, 0.2);
    }
    
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-light);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-title svg {
      width: 18px;
      height: 18px;
    }
    
    .card-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(139, 49, 255, 0.4);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(139, 49, 255, 0.5);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn svg {
      width: 20px;
      height: 20px;
    }
    
    .status {
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s infinite;
    }
    
    .status-dot.online {
      background: #22c55e;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .logo {
      margin-bottom: 24px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .logo span {
      color: var(--primary-light);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PlentyPay</div>
    
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 5.636a9 9 0 000 12.728M9.172 9.172a4 4 0 015.656 0M14.828 14.828a4 4 0 01-5.656 0M12 12h.01" />
      </svg>
    </div>
    
    <h1>Sin conexión a Internet</h1>
    <p class="subtitle">No te preocupes, tus datos están seguros. La app sincronizará automáticamente cuando vuelvas a conectarte.</p>
    
    <div class="card">
      <div class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        Disponible sin conexión
      </div>
      <p class="card-text">
        El dashboard, lista de clientes y facturas recientes están disponibles aunque no tengas Internet.
      </p>
    </div>
    
    <a href="/dashboard" class="btn" id="dashboardBtn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      Ir al Dashboard
    </a>
    
    <div class="status" id="connectionStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Sin conexión</span>
    </div>
  </div>
  
  <script>
    function updateConnectionStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Conectado - Redirigiendo...';
        // Redirect to dashboard after a brief moment
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1500);
      } else {
        dot.classList.remove('online');
        text.textContent = 'Sin conexión';
      }
    }
    
    // Check immediately
    updateConnectionStatus();
    
    // Listen for connection changes
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
  </script>
</body>
</html>
