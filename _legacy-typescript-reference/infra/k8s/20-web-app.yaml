apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: plentypay
spec:
  replicas: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/plentypay-web:latest # AJUSTAR
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: plentypay-secrets }
            - configMapRef: { name: plentypay-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: plentypay-secrets, key: POOLED_DATABASE_URL } } # vía el Pooler, no la conexión directa
          readinessProbe:
            httpGet: { path: /api/health/db, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/db, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: plentypay }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web, namespace: plentypay }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 3
  maxReplicas: 30 # sube este techo con datos reales de carga — ver documento 02 §2 (dimensionamiento)
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
