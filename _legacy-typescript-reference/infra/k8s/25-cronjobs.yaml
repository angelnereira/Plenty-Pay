# Reemplaza los `crons` de vercel.json por CronJobs nativos de Kubernetes.
# Cada uno llama al mismo endpoint /api/cron/* de siempre, autenticado igual
# (Bearer CRON_SECRET) — no se reescribió ninguna lógica de negocio, solo el disparador.
#
# NOTA: /api/cron/keep-warm se omite a propósito: existía solo para evitar el
# "cold start" de las funciones serverless de Vercel. Los pods de `web` corren
# permanentemente en Kubernetes (20-web-app.yaml, minReplicas: 3) — ese problema no existe aquí.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-cleanup-reservations
  namespace: plentypay
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cron
              image: curlimages/curl:8.11.0
              env:
                - name: CRON_SECRET
                  valueFrom: { secretKeyRef: { name: plentypay-secrets, key: CRON_SECRET } }
              command:
                - sh
                - -c
                - |
                  curl -sf -X POST \
                    -H "Authorization: Bearer $(CRON_SECRET)" \
                    http://web.plentypay.svc.cluster.local/api/cron/cleanup-reservations
---
