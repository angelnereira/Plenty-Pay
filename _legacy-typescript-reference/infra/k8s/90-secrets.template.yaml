# ⚠️ PLANTILLA. Los valores de abajo son de EJEMPLO — nunca aplicar este archivo tal cual a un
# clúster real. En producción, generar el Secret desde variables de entorno/CI (nunca comitear el
# YAML con valores reales) o, mejor, gestionarlo con OpenBao/Sealed Secrets/SOPS (documento 02 §5).
#
# Cómo generarlo de forma segura a partir de .env (no de este archivo):
#   kubectl create secret generic plentypay-secrets --from-env-file=.env -n plentypay --dry-run=client -o yaml > secrets.generated.yaml
apiVersion: v1
kind: Secret
metadata:
  name: plentypay-secrets
  namespace: plentypay
type: Opaque
stringData:
  # Base de datos — DIRECT_* para migraciones (advisory locks), POOLED_* para la app (vía PgBouncer)
  DIRECT_DATABASE_URL: "postgresql://plentypay:CAMBIAR@plentypay-postgres-rw.plentypay.svc.cluster.local:5432/plentypay"
  POOLED_DATABASE_URL: "postgresql://plentypay:CAMBIAR@plentypay-postgres-pooler-rw.plentypay.svc.cluster.local:5432/plentypay?pgbouncer=true"

  # Cache / rate limiting (Valkey + puente REST de Upstash)
  VALKEY_PASSWORD: "CAMBIAR-openssl-rand-base64-32"
  SRH_TOKEN: "CAMBIAR-openssl-rand-base64-32"
  UPSTASH_REDIS_REST_URL: "http://srh.plentypay.svc.cluster.local"
  UPSTASH_REDIS_REST_TOKEN: "CAMBIAR-igual-que-SRH_TOKEN"

  # Cron interno (CronJob → /api/cron/*)
  CRON_SECRET: "CAMBIAR-openssl-rand-base64-32"

  # Auth (ver docs/SECURITY.md para NEXTAUTH_SECRET; MOBILE_JWT_SECRET es NUEVO — nunca reutilizar el mismo valor)
  NEXTAUTH_SECRET: "CAMBIAR-openssl-rand-base64-32"
  MOBILE_JWT_SECRET: "CAMBIAR-openssl-rand-base64-32-DISTINTO-AL-DE-ARRIBA"

  # Cifrado de credenciales HKA/certificados (ver docs/SECURITY.md) — mover a OpenBao/KMS real antes de producción
  ENCRYPTION_KEY: "CAMBIAR"
  CERTIFICATE_ENCRYPTION_KEY: "CAMBIAR"
  CERTIFICATE_MASTER_KEY: "CAMBIAR"

  # Pagos — ver services/payments-orchestrator/src/adapters/*: en blanco = modo sandbox/simulado
  YAPPY_MERCHANT_ID: ""
  YAPPY_SECRET_KEY: ""
  YAPPY_API_BASE_URL: ""
  TELERED_AFFILIATE_CODE: ""
  TELERED_API_KEY: ""
  TELERED_API_BASE_URL: ""
  CARD_PSP_API_KEY: ""
  CARD_PSP_API_BASE_URL: ""
  CARD_PSP_WEBHOOK_SECRET: ""

  # El resto de las variables (email, storage, HKA, Sentry, IA...) sigue igual que en
  # web/env.template — cópialas aquí. No se repiten todas en esta plantilla para no
  # duplicar una lista que ya existe y que hay que mantener en un solo lugar.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plentypay-config
  namespace: plentypay
data:
  NODE_ENV: "production"
  PAYMENTS_ORCHESTRATOR_URL: "payments-orchestrator.plentypay.svc.cluster.local:50051"
  WALLET_LEDGER_URL: "wallet-ledger.plentypay.svc.cluster.local:50052"
  PLENTYPAY_API_BASE_URL: "http://web.plentypay.svc.cluster.local"
