# PlentyPay — Configuración NATS JetStream (F07.4 - F07.6)
# SPEC: event-bus/SPEC.md

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_mem: 512MB
  max_file: 5GB
}

accounts {
  PLENTYPAY {
    jetstream: enabled
    users = [
      {
        user: "admin"
        password: "admin_nats_secret"
        permissions: {
          publish: [">"]
          subscribe: [">"]
        }
      },
      {
        user: "identity_svc"
        password: "identity_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.identity.>", "pp.audit.identity.>", "pp.dlq.identity.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.identity.>", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "payments_svc"
        password: "payments_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.payments.>", "pp.audit.payments-core.>", "pp.dlq.payments.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.identity.tenant.status_changed.v1", "pp.ledger.hold.status_changed.v1", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "ledger_svc"
        password: "ledger_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.ledger.>", "pp.audit.ledger.>", "pp.dlq.ledger.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "settlement_svc"
        password: "settlement_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.settlement.>", "pp.audit.settlement.>", "pp.dlq.settlement.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.ledger.transaction.posted.v1", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "fiscal_svc"
        password: "fiscal_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.fiscal.>", "pp.audit.fiscal-invoicing.>", "pp.dlq.fiscal.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.pos.sale.paid.v1", "pp.orders.order.paid.v1", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "catalog_svc"
        password: "catalog_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.catalog.>", "pp.audit.catalog.>", "pp.dlq.catalog.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.identity.tenant.status_changed.v1", "pp.inventory.stock.changed.v1", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "inventory_svc"
        password: "inventory_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.inventory.>", "pp.audit.inventory.>", "pp.dlq.inventory.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "orders_svc"
        password: "orders_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.orders.>", "pp.audit.orders.>", "pp.dlq.orders.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.payments.payment.captured.v1", "pp.catalog.product.changed.v1", "pp.logistics.delivery.status_changed.v1", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "pos_svc"
        password: "pos_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.pos.>", "pp.audit.pos.>", "pp.dlq.pos.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.payments.payment.captured.v1", "pp.logistics.delivery.status_changed.v1", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "logistics_svc"
        password: "logistics_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.logistics.>", "pp.audit.logistics.>", "pp.dlq.logistics.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.geo.geofence.crossed.v1", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "geo_svc"
        password: "geo_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.geo.>", "pp.audit.geolocation.>", "pp.dlq.geo.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "payroll_svc"
        password: "payroll_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.payroll.>", "pp.audit.payroll.>", "pp.dlq.payroll.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "notifications_svc"
        password: "notifications_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.notifications.>", "pp.audit.notifications.>", "pp.dlq.notifications.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: [
              "pp.identity.tenant.status_changed.v1",
              "pp.identity.session.revoked.v1",
              "pp.payments.>",
              "pp.settlement.>",
              "pp.fiscal.>",
              "pp.orders.>",
              "pp.inventory.>",
              "pp.pos.sale.paid.v1",
              "pp.logistics.>",
              "pp.geo.>",
              "pp.payroll.>",
              "_INBOX.>",
              "$JS.API.>"
            ]
          }
        }
      },
      {
        user: "analytics_svc"
        password: "analytics_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.analytics.>", "pp.audit.analytics-bi.>", "pp.dlq.analytics.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: [
              "pp.audit.>",
              "pp.payments.>",
              "pp.ledger.>",
              "pp.settlement.>",
              "pp.fiscal.>",
              "pp.catalog.>",
              "pp.orders.>",
              "pp.pos.>",
              "pp.logistics.>",
              "pp.payroll.>",
              "_INBOX.>",
              "$JS.API.>"
            ]
          }
        }
      },
      {
        user: "security_svc"
        password: "security_nats_secret"
        permissions: {
          publish: {
            allow: ["pp.security.>", "pp.audit.security.>", "pp.dlq.security.>", "_INBOX.>", "$JS.API.>"]
          }
          subscribe: {
            allow: ["pp.audit.>", "_INBOX.>", "$JS.API.>"]
          }
        }
      },
      {
        user: "gateway_svc"
        password: "gateway_nats_secret"
        permissions: {
          publish: {
            allow: [
              "pp.gateway.>",
              "pp.audit.api-gateway.>",
              "pp.dlq.gateway.>",
              "_INBOX.>",
              "$JS.API.>",
              "$KV.pp_ratelimit.>",
              "KV_pp_ratelimit.>"
            ]
          }
          subscribe: {
            allow: [
              "pp.identity.session.revoked.v1",
              "_INBOX.>",
              "$JS.API.>",
              "$KV.pp_ratelimit.>",
              "KV_pp_ratelimit.>"
            ]
          }
        }
      },
      {
        user: "infra_svc"
        password: "infra_nats_secret"
        permissions: {
          publish: {
            allow: [
              "pp.infra.>",
              "pp.audit.infra-management.>",
              "pp.dlq.infra.>",
              "_INBOX.>",
              "$JS.API.>",
              "$KV.>",
              "KV_>"
            ]
          }
          subscribe: {
            allow: [
              "_INBOX.>",
              "$JS.API.>",
              "$KV.>",
              "KV_>"
            ]
          }
        }
      }
    ]
  }
}
