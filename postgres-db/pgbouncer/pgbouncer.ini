[databases]
plentypay = host=postgres-db port=5432 dbname=plentypay
* = host=postgres-db port=5432

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = postgres
auth_dbname = plentypay
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

# Modo de pooling: transacción obligatorio (SPEC §2, ADR 0014)
pool_mode = transaction

max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
server_idle_timeout = 600
server_connect_timeout = 15

admin_users = postgres
stats_users = postgres,readonly_ops

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
