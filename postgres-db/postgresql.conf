# PostgreSQL 16 Base Configuration - PlentyPay
# SPEC: postgres-db/SPEC.md §3

listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Configuración de archivado continuo de WAL (F06.4)
archive_mode = on
archive_command = 'mkdir -p /var/lib/postgresql/wal_archive && test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# Telemetría y monitoreo
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# Zona horaria (UTC obligatorio)
timezone = 'UTC'
log_timezone = 'UTC'
