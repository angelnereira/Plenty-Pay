name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  buf:
    name: contratos (lint + codegen limpio)
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: buf disponible (v1.73.0, arm64)
        run: |
          command -v buf >/dev/null 2>&1 || {
            curl -sSLo "$HOME/.local/bin/buf" \
              "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-aarch64"
            chmod +x "$HOME/.local/bin/buf"
          }
          buf --version
      - name: buf lint
        run: cd contracts && buf lint
      - name: buf generate (stubs al día)
        run: cd contracts && buf generate && git diff --exit-code

  go:
    name: go (vet + unit + integración con PostgreSQL real)
    runs-on: [self-hosted, linux, arm64]
    env:
      # BD DE PRUEBA desechable y separada de la BD del servicio dev
      # (plentypay_ci ≠ plentypay). sslmode=disable solo red local del host.
      IDENTITY_TEST_DATABASE_URL: postgres://plentypay_dev:${{ secrets.DEPLOY_PG_PASSWORD }}@127.0.0.1:5432/plentypay_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: gofmt (sin diffs)
        run: test -z "$(gofmt -l services/identity)" || { gofmt -l services/identity; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (unit)
        run: go test ./...
      - name: preparar BD de integración (desechable, aparte de dev)
        run: |
          cd deployment/compose
          sudo docker compose up -d postgres
          for i in $(seq 1 30); do
            sudo docker compose exec -T postgres pg_isready -U plentypay_dev && break
            sleep 1
          done
          sudo docker compose exec -T postgres psql -U plentypay_dev -d plentypay \
            -tc "select 1 from pg_database where datname='plentypay_ci'" | grep -q 1 || \
            sudo docker compose exec -T postgres psql -U plentypay_dev -d plentypay \
            -c "create database plentypay_ci"
      - name: go test (integración contra PostgreSQL real)
        run: go test -tags integration ./...

  rust:
    name: rust (fmt + clippy + test)
    runs-on: [self-hosted, linux, arm64]
    defaults:
      run:
        working-directory: services/ledger
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  docker:
    name: docker build (identity, distroless)
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen
        run: sudo docker build -f services/identity/Dockerfile -t plentypay/identity:ci .
