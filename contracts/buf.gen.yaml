# Genera stubs Go de los contratos (mandato §10). Los servicios Go importan
# el módulo plentypay.dev/contracts/gen (código de CONTRATO, no modelos
# internos — permitido por §3). Rust genera con prost-build en build.rs.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
