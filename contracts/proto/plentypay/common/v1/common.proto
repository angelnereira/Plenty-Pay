// PlentyPay — Tipos comunes compartidos vía contratos (único mecanismo permitido
// de compartición entre servicios; mandato §3/§10).
//
// Regla de dinero (ADR-0002): SIEMPRE entero de unidades menores + código
// ISO-4217 explícito. Prohibido float/double en cualquier representación.
syntax = "proto3";

package plentypay.common.v1;

option go_package = "plentypay.dev/contracts/gen/go/plentypay/common/v1;commonv1";

// Dinero exacto. Ej: 12,34 USD => minor_units=1234, currency_code="USD".
message Money {
  int64 minor_units = 1;   // entero, nunca float; el signo solo se usa en lecturas de saldo neto
  string currency_code = 2; // ISO-4217: "USD" | "PAB" (par 1:1, ADR-0002)
}

// Estado de servicio para readiness/liveness (sin dependencias externas, ADR-0005).
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  string service = 1; // vacío = salud global del servicio
}

message CheckResponse {
  ServingStatus status = 1;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING_STATUS_SERVING = 1;
  SERVING_STATUS_NOT_SERVING = 2;
}
