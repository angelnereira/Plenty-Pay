// PlentyPay — Ledger (núcleo contable, mandato §12).
// Doble partida, inmutabilidad, idempotencia a nivel de fila, reversos
// explícitos ligados a la partida original, dinero exacto (ADR-0002).
// El saldo es RESULTADO de las entradas, nunca un valor editado a mano.
syntax = "proto3";

package plentypay.ledger.v1;

import "google/protobuf/timestamp.proto";
import "plentypay/common/v1/common.proto";

option go_package = "plentypay.dev/contracts/gen/go/plentypay/ledger/v1;ledgerv1";

service LedgerService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc PostTransaction(PostTransactionRequest) returns (PostTransactionResponse);
  rpc ReverseTransaction(ReverseTransactionRequest) returns (ReverseTransactionResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc GetAccountBalance(GetAccountBalanceRequest) returns (GetAccountBalanceResponse);

  // Retenciones (doc 03 §10.1) — marketplace: retener pago hasta confirmación.
  // Implementación en Etapa 3; el contrato v1 es estable desde ahora.
  rpc HoldFunds(HoldFundsRequest) returns (HoldFundsResponse);
  rpc CaptureHold(CaptureHoldRequest) returns (CaptureHoldResponse);
  rpc ReleaseHold(ReleaseHoldRequest) returns (ReleaseHoldResponse);
}

message LedgerAccount {
  string account_id = 1;
  string tenant_id = 2;           // aislamiento multi-tenant (doc 01 §6)
  string owner_reference = 3;     // user_id / merchant_id del dominio llamador
  LedgerAccountType account_type = 4;
  string currency_code = 5;       // ADR-0002: moneda fija por cuenta, sin default
}

enum LedgerAccountType {
  LEDGER_ACCOUNT_TYPE_UNSPECIFIED = 0;
  LEDGER_ACCOUNT_TYPE_USER_WALLET = 1;     // billetera de persona
  LEDGER_ACCOUNT_TYPE_MERCHANT_CLEARING = 2; // por liquidar al comercio
  LEDGER_ACCOUNT_TYPE_PLATFORM_FEE = 3;    // comisión de la plataforma
  LEDGER_ACCOUNT_TYPE_TREASURY = 4;        // tesorería / fondeo
}

message CreateAccountRequest {
  string tenant_id = 1;
  string owner_reference = 2;
  LedgerAccountType account_type = 3;
  string currency_code = 4;
}

message CreateAccountResponse {
  LedgerAccount account = 1;
}

enum LedgerDirection {
  LEDGER_DIRECTION_UNSPECIFIED = 0;
  LEDGER_DIRECTION_DEBIT = 1;
  LEDGER_DIRECTION_CREDIT = 2;
}

// Especificación de entrada para escribir. El entry_id lo asigna el servidor.
message LedgerEntrySpec {
  string account_id = 1;
  LedgerDirection direction = 2;
  plentypay.common.v1.Money amount = 3; // SIEMPRE positivo; el signo vive en la dirección
}

message LedgerEntry {
  string entry_id = 1;
  string account_id = 2;
  LedgerDirection direction = 3;
  plentypay.common.v1.Money amount = 4;
}

message LedgerTransaction {
  string transaction_id = 1;
  repeated LedgerEntry entries = 2;
  string reverse_of_transaction_id = 3; // reverso auditable (doc 01 §6: compensatesEntryId)
  string idempotency_key = 4;           // webhook duplicado ⇒ misma transacción, no dos
  google.protobuf.Timestamp created_at = 5;
}

message PostTransactionRequest {
  repeated LedgerEntrySpec entries = 1;
  string idempotency_key = 2; // obligatorio para operaciones de dinero
  string reference = 3;       // referencia de negocio (charge_id, orden, etc.)
}

message PostTransactionResponse {
  LedgerTransaction transaction = 1;
  bool replayed = 2; // true si la clave de idempotencia ya había materializado esta operación
}

message ReverseTransactionRequest {
  string transaction_id = 1; // partida original a compensar
  string idempotency_key = 2;
  string reason = 3;
}

message ReverseTransactionResponse {
  LedgerTransaction reversal = 1;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message GetTransactionResponse {
  LedgerTransaction transaction = 1;
}

message ListTransactionsRequest {
  string account_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListTransactionsResponse {
  repeated LedgerTransaction transactions = 1;
  string next_page_token = 2;
}

message GetAccountBalanceRequest {
  string account_id = 1;
}

message GetAccountBalanceResponse {
  string account_id = 1;
  plentypay.common.v1.Money balance = 2; // neto disponible (puede ser firmado; política de cuenta en Etapa 2)
  plentypay.common.v1.Money held = 3;    // retenido en holds abiertos
}

message LedgerHold {
  string hold_id = 1;
  string account_id = 2;
  plentypay.common.v1.Money amount = 3;
  LedgerHoldState state = 4;
  string reference = 5;
  google.protobuf.Timestamp created_at = 6;
}

enum LedgerHoldState {
  LEDGER_HOLD_STATE_UNSPECIFIED = 0;
  LEDGER_HOLD_STATE_OPEN = 1;
  LEDGER_HOLD_STATE_CAPTURED = 2;
  LEDGER_HOLD_STATE_RELEASED = 3;
}

message HoldFundsRequest {
  string account_id = 1;
  plentypay.common.v1.Money amount = 2;
  string idempotency_key = 3;
  string reference = 4;
}

message HoldFundsResponse {
  LedgerHold hold = 1;
}

message CaptureHoldRequest {
  string hold_id = 1;
  string destination_account_id = 2; // a quién se asienta lo capturado
}

message CaptureHoldResponse {
  LedgerHold hold = 1;
  LedgerTransaction transaction = 2;
}

message ReleaseHoldRequest {
  string hold_id = 1;
}

message ReleaseHoldResponse {
  LedgerHold hold = 1;
}
