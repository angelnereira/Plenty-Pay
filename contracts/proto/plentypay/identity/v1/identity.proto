// PlentyPay — Identity (Etapa 1). Identidad, sesiones y contexto de autorización
// que alimenta la app dinámica (mandato §7): identity → tenant → role →
// permissions → features. La autorización real vive en backend.
//
// Passkeys/WebAuthn: PLANNED — se añade como RPC nuevo, no editando el contrato
// publicado (breaking checks vía buf).
syntax = "proto3";

package plentypay.identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "plentypay.dev/contracts/gen/go/plentypay/identity/v1;identityv1";

service IdentityService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc AuthenticatePassword(AuthenticatePasswordRequest) returns (AuthenticatePasswordResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc GetAuthorizationContext(GetAuthorizationContextRequest) returns (GetAuthorizationContextResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message Tenant {
  string tenant_id = 1;
  string name = 2;
  TenantStatus status = 3;
}

enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_ACTIVE = 1;
  TENANT_STATUS_SUSPENDED = 2;
}

message User {
  string user_id = 1;
  string tenant_id = 2;
  string email = 3;
  UserStatus status = 4;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_DISABLED = 3;
}

message Session {
  string session_id = 1;
  string user_id = 2;
  string token = 3; // opaco; se revoca server-side; nunca material de firma en cliente
  google.protobuf.Timestamp expires_at = 4;
}

message CreateTenantRequest {
  string name = 1;
  string owner_email = 2;
  string owner_password = 3; // se hashea (argon2id) en el servicio; nunca se persiste en claro ni se loguea
}

message CreateTenantResponse {
  Tenant tenant = 1;
  User owner = 2;
}

message CreateUserRequest {
  string tenant_id = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  User user = 1;
}

message AuthenticatePasswordRequest {
  string email = 1;
  string password = 2;
}

message AuthenticatePasswordResponse {
  Session session = 1;
  User user = 2;
}

message ValidateSessionRequest {
  string token = 1;
}

message ValidateSessionResponse {
  bool valid = 1;
  User user = 2; // set solo si valid
}

// Contrato central de la app dinámica (mandato §7): el cliente solo muestra
// capacidades autorizadas; la autorización real ocurre en backend en cada RPC.
message GetAuthorizationContextRequest {
  string session_token = 1;
}

message GetAuthorizationContextResponse {
  User user = 1;
  Tenant tenant = 2;
  repeated Role roles = 3;
  repeated Permission permissions = 4;
  repeated Feature features = 5;
}

message Role {
  string key = 1;  // ej. "OWNER", "CASHIER", "WAITER", "CONSUMER"
  string name = 2;
}

message Permission {
  string resource = 1; // ej. "pos", "inventory", "reports"
  string action = 2;   // ej. "read", "write", "approve"
}

message Feature {
  string key = 1;  // ej. "wallet", "pos", "marketplace", "invoicing"
  bool enabled = 2;
}

message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {}
