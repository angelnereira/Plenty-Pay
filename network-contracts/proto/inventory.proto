syntax = "proto3";
package plentypay.inventory.v1;

option go_package = "plentypay/inventory/pb";

import "google/protobuf/timestamp.proto";
import "common.proto";

// inventory: cuánto hay de cada producto, dónde, y cuándo reponerlo. Spec: inventory/SPEC.md
service Inventory {
  rpc UpsertWarehouse(UpsertWarehouseRequest) returns (Warehouse);
  rpc ListWarehouses(ListWarehousesRequest) returns (ListWarehousesResponse);

  rpc GetStock(GetStockRequest) returns (StockLevel);
  rpc ListStock(ListStockRequest) returns (ListStockResponse);
  rpc AdjustStock(AdjustStockRequest) returns (StockMovement);
  rpc TransferStock(TransferStockRequest) returns (TransferStockResponse);
  rpc ListMovements(ListMovementsRequest) returns (ListMovementsResponse);
  // F16.4 (R5): lotes de un producto con su vencimiento y su existencia.
  rpc ListLots(ListLotsRequest) returns (ListLotsResponse);

  // Reservas: protegen el stock entre "agregar al carrito" y "pago confirmado"
  rpc ReserveStock(ReserveStockRequest) returns (Reservation);      // todo o nada, idempotente
  rpc CommitReservation(CommitReservationRequest) returns (Reservation);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (Reservation);

  rpc UpsertSupplier(UpsertSupplierRequest) returns (Supplier);
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse);
  rpc CreatePurchaseOrder(CreatePurchaseOrderRequest) returns (PurchaseOrder);
  rpc UpdatePurchaseOrderStatus(UpdatePurchaseOrderStatusRequest) returns (PurchaseOrder);
  rpc ReceiveGoods(ReceiveGoodsRequest) returns (PurchaseOrder);
  rpc ListPurchaseOrders(ListPurchaseOrdersRequest) returns (ListPurchaseOrdersResponse);

  rpc GetReorderSuggestions(GetReorderSuggestionsRequest) returns (GetReorderSuggestionsResponse);
}

message Warehouse { string warehouse_id = 1; string tenant_id = 2; string name = 3; string branch_code = 4; plentypay.common.v1.Address address = 5; bool active = 6; bool is_default = 7; }
message UpsertWarehouseRequest { Warehouse warehouse = 1; }
message ListWarehousesRequest {}
message ListWarehousesResponse { repeated Warehouse warehouses = 1; }

message StockLevel {
  string product_id = 1;
  string warehouse_id = 2;
  int64 on_hand_milli = 3;
  int64 reserved_milli = 4;
  int64 available_milli = 5;    // on_hand - reserved
  int64 reorder_point_milli = 6;
  string lot_id = 7;
}
message GetStockRequest { string product_id = 1; string warehouse_id = 2; }
message ListStockRequest { string warehouse_id = 1; bool only_low = 2; plentypay.common.v1.PageRequest page = 3; }
message ListStockResponse { repeated StockLevel levels = 1; plentypay.common.v1.PageInfo page = 2; }

enum MovementType {
  MOVEMENT_TYPE_UNSPECIFIED = 0;
  MOVEMENT_TYPE_RECEIPT = 1;
  MOVEMENT_TYPE_SALE = 2;
  MOVEMENT_TYPE_ADJUSTMENT = 3;
  MOVEMENT_TYPE_TRANSFER_OUT = 4;
  MOVEMENT_TYPE_TRANSFER_IN = 5;
  MOVEMENT_TYPE_RETURN = 6;
  MOVEMENT_TYPE_WRITE_OFF = 7;
}
message StockMovement {
  string movement_id = 1;
  string product_id = 2;
  string warehouse_id = 3;
  MovementType type = 4;
  int64 delta_milli = 5;
  string reason = 6;
  plentypay.common.v1.Reference reference = 7;
  string lot_id = 8;
  google.protobuf.Timestamp occurred_at = 9;
  string actor_user_id = 10;
  string lot_code = 11;                          // F16.4: código del lote del movimiento
  google.protobuf.Timestamp lot_expires_at = 12; // vencimiento del lote (00:00 del día, America/Panama)
}
message AdjustStockRequest {
  string idempotency_key = 1;
  string product_id = 2;
  string warehouse_id = 3;
  int64 delta_milli = 4;
  MovementType type = 5;
  string reason = 6;              // obligatorio para ADJUSTMENT y WRITE_OFF
  string lot_id = 7;
  plentypay.common.v1.Reference reference = 8; // qué lo causó (p. ej. {sale, <id>}); lo fijan pos/orders
  string lot_code = 9;                          // F16.4: entrada → lote (se crea si no existe); salida → ese lote; vacío en salida = FEFO
  google.protobuf.Timestamp lot_expires_at = 10; // vencimiento al crear el lote en una entrada
}
message TransferStockRequest { string idempotency_key = 1; string product_id = 2; string from_warehouse_id = 3; string to_warehouse_id = 4; int64 quantity_milli = 5; string reason = 6;
  string lot_code = 7; // F16.4: vacío = FEFO; el destino recibe los mismos lotes
}
message TransferStockResponse { StockMovement out = 1; StockMovement in = 2; }
message ListMovementsRequest { string product_id = 1; string warehouse_id = 2; plentypay.common.v1.TimeRange range = 3; plentypay.common.v1.PageRequest page = 4; }
message ListMovementsResponse { repeated StockMovement movements = 1; plentypay.common.v1.PageInfo page = 2; }

// F16.4 (R5): un lote de un producto en una bodega.
message Lot {
  string lot_id = 1;
  string product_id = 2;
  string warehouse_id = 3;
  string code = 4;
  google.protobuf.Timestamp expires_at = 5;  // vacío = sin vencimiento
  int64 on_hand_milli = 6;
  bool expired = 7;                          // vence antes de hoy (America/Panama)
}
message ListLotsRequest { string product_id = 1; string warehouse_id = 2; bool include_empty = 3; }
message ListLotsResponse { repeated Lot lots = 1; }

message ReservationLine { string product_id = 1; int64 quantity_milli = 2; }
enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_COMMITTED = 2;
  RESERVATION_STATUS_RELEASED = 3;
  RESERVATION_STATUS_EXPIRED = 4;
}
message Reservation {
  string reservation_id = 1;
  string warehouse_id = 2;
  repeated ReservationLine lines = 3;
  ReservationStatus status = 4;
  plentypay.common.v1.Reference reference = 5;
  google.protobuf.Timestamp expires_at = 6;
}
message ReserveStockRequest {
  string idempotency_key = 1;
  string warehouse_id = 2;        // vacío = almacén por defecto del comercio
  repeated ReservationLine lines = 3;
  plentypay.common.v1.Reference reference = 4;
  int32 ttl_seconds = 5;          // por defecto 900; ninguna reserva es indefinida
  bool allow_negative = 6;        // decisión explícita; por defecto false
}
message CommitReservationRequest { string reservation_id = 1; 
  string idempotency_key = 2;}
message ReleaseReservationRequest { string reservation_id = 1; 
  string idempotency_key = 2;}

message Supplier { string supplier_id = 1; string name = 2; string tax_id = 3; string email = 4; string phone = 5; bool active = 6;
  int32 lead_time_days = 7;   // días que tarda en entregar (R6); por defecto 7
  string check_digit = 8;     // DV del RUC (N-FMT-06)
}
message UpsertSupplierRequest { Supplier supplier = 1; string idempotency_key = 2; } // la clave se exige al crear
message ListSuppliersRequest { plentypay.common.v1.PageRequest page = 1; }
message ListSuppliersResponse { repeated Supplier suppliers = 1; plentypay.common.v1.PageInfo page = 2; }

enum PurchaseOrderStatus {
  PURCHASE_ORDER_STATUS_UNSPECIFIED = 0;
  PURCHASE_ORDER_STATUS_DRAFT = 1;
  PURCHASE_ORDER_STATUS_SENT = 2;
  PURCHASE_ORDER_STATUS_PARTIALLY_RECEIVED = 3;
  PURCHASE_ORDER_STATUS_RECEIVED = 4;
  PURCHASE_ORDER_STATUS_CANCELLED = 5;
}
message PurchaseOrderLine { string product_id = 1; int64 ordered_milli = 2; int64 received_milli = 3; plentypay.common.v1.Money unit_cost = 4; }
message PurchaseOrder {
  string purchase_order_id = 1;
  string supplier_id = 2;
  string warehouse_id = 3;
  PurchaseOrderStatus status = 4;
  repeated PurchaseOrderLine lines = 5;
  google.protobuf.Timestamp expected_at = 6;
  plentypay.common.v1.Money total = 7;            // Σ cantidad × costo unitario (calculado por el servidor)
  google.protobuf.Timestamp created_at = 8;
  string supplier_name = 9;                       // solo lectura
  int32 version = 10;
}
message CreatePurchaseOrderRequest { PurchaseOrder order = 1; string idempotency_key = 2; }
message UpdatePurchaseOrderStatusRequest { string purchase_order_id = 1; PurchaseOrderStatus status = 2; 
  string idempotency_key = 3;}
message ReceivedLine { string product_id = 1; int64 received_milli = 2; string lot_code = 3; google.protobuf.Timestamp expires_at = 4; }
message ReceiveGoodsRequest { string purchase_order_id = 1; string idempotency_key = 2; repeated ReceivedLine lines = 3;
  string supplier_invoice = 4; // número de la factura del proveedor (S-INV-06 e4)
}
message ListPurchaseOrdersRequest { PurchaseOrderStatus status = 1; plentypay.common.v1.PageRequest page = 2; }
message ListPurchaseOrdersResponse { repeated PurchaseOrder orders = 1; plentypay.common.v1.PageInfo page = 2; }

message ReorderSuggestion {
  string product_id = 1;
  string warehouse_id = 2;
  int64 suggested_quantity_milli = 3;
  int64 reorder_point_milli = 4;
  int64 avg_daily_demand_milli = 5;
  int32 days_of_cover = 6;
  string abc_class = 7;
  int64 available_milli = 8;
  int64 in_transit_milli = 9;    // pedido en órdenes enviadas y aún no recibido
  string supplier_id = 10;       // proveedor habitual: el de la última orden con este producto
  string supplier_name = 11;
  int32 lead_time_days = 12;
}
message GetReorderSuggestionsRequest { string warehouse_id = 1; }
message GetReorderSuggestionsResponse { repeated ReorderSuggestion suggestions = 1; }

// ── Eventos. Subject: pp.inventory.<entidad>.<hecho>.v1 ──
message StockLow { string product_id = 1; string warehouse_id = 2; string tenant_id = 3; int64 available_milli = 4; int64 reorder_point_milli = 5; }
message StockChanged { string product_id = 1; string warehouse_id = 2; string tenant_id = 3; int64 on_hand_milli = 4; int64 available_milli = 5; }
