syntax = "proto3";
package plentypay.security.v1;

option go_package = "plentypay/security/pb";

import "google/protobuf/timestamp.proto";
import "common.proto";

// security: secretos, cifrado como servicio, auditoría inmutable y señales de seguridad.
// Ningún otro contenedor guarda secretos de terceros ni implementa su propio cifrado de datos sensibles. Spec: security/SPEC.md
service Security {
  rpc GetSecret(GetSecretRequest) returns (Secret);            // solo llamadores en allowed_readers
  rpc PutSecret(PutSecretRequest) returns (SecretMetadata);
  rpc RotateSecret(RotateSecretRequest) returns (SecretMetadata);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse); // solo metadatos

  rpc Encrypt(EncryptRequest) returns (EncryptResponse);       // envelope encryption por propósito
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);
  rpc RotateDataKey(RotateDataKeyRequest) returns (RotateDataKeyResponse);

  rpc AppendAuditEvent(AppendAuditEventRequest) returns (AuditEvent);
  rpc QueryAuditEvents(QueryAuditEventsRequest) returns (QueryAuditEventsResponse);
  rpc VerifyAuditChain(VerifyAuditChainRequest) returns (VerifyAuditChainResponse);

  rpc ReportSecurityEvent(ReportSecurityEventRequest) returns (ReportSecurityEventResponse);
  rpc IsBlocked(IsBlockedRequest) returns (IsBlockedResponse);

  rpc IssueServiceCertificate(IssueServiceCertificateRequest) returns (ServiceCertificate); // mTLS (ADR 0011)
}

message GetSecretRequest { string name = 1; string version = 2; }
message Secret { string name = 1; string version = 2; bytes value = 3; }
message PutSecretRequest { string name = 1; bytes value = 2; map<string, string> labels = 3; repeated string allowed_readers = 4; 
  string idempotency_key = 5;}
message RotateSecretRequest { string name = 1; bytes new_value = 2; 
  string idempotency_key = 3;}
message SecretMetadata { string name = 1; string version = 2; google.protobuf.Timestamp created_at = 3; repeated string allowed_readers = 4; map<string, string> labels = 5; }
message ListSecretsRequest { string name_prefix = 1; }
message ListSecretsResponse { repeated SecretMetadata secrets = 1; }

// AAD canónico: "<tenant_id>|<resource_id>" (SPEC §5 R3); vacío solo para datos de plataforma.
message EncryptRequest { string key_purpose = 1; bytes plaintext = 2; bytes associated_data = 3; } // "national_id", "payout_destination", "biometric_template", "tax_id"
message EncryptResponse { bytes ciphertext = 1; string key_version = 2; }
// AAD canónico: "<tenant_id>|<resource_id>"; un AAD distinto del usado al cifrar falla.
message DecryptRequest { string key_purpose = 1; bytes ciphertext = 2; bytes associated_data = 3; string key_version = 4; }
message DecryptResponse { bytes plaintext = 1; }
message RotateDataKeyRequest { string key_purpose = 1; 
  string idempotency_key = 2;}
message RotateDataKeyResponse { string new_key_version = 1; }

message AuditEvent {
  string event_id = 1;
  string tenant_id = 2;
  string actor_user_id = 3;
  string actor_role = 4;
  string action = 5;                 // "payment.refund", "user.role.assign", "secret.read", ...
  plentypay.common.v1.Reference target = 6;
  string outcome = 7;                // "SUCCESS" | "DENIED" | "ERROR"
  string ip_address = 8;
  string request_id = 9;
  map<string, string> details = 10;  // sin datos sensibles
  string prev_hash = 11;             // cadena de hashes: detecta manipulación
  string hash = 12;
  google.protobuf.Timestamp occurred_at = 13;
  string actor_service = 14;
}
message AppendAuditEventRequest {
  AuditEvent event = 1;
  string idempotency_key = 2; // el evento es append-only: sin clave un reintento duplica la fila encadenada
}
message QueryAuditEventsRequest { string tenant_id = 1; string actor_user_id = 2; string action_prefix = 3; plentypay.common.v1.TimeRange range = 4; plentypay.common.v1.PageRequest page = 5; }
message QueryAuditEventsResponse { repeated AuditEvent events = 1; plentypay.common.v1.PageInfo page = 2; }
message VerifyAuditChainRequest { plentypay.common.v1.TimeRange range = 1; }
message VerifyAuditChainResponse { bool intact = 1; string first_broken_event_id = 2; }

// kind: "LOGIN_FAILED", "TOKEN_REUSE", "VELOCITY_EXCEEDED", "WEBHOOK_BAD_SIGNATURE"
message ReportSecurityEventRequest {
  string kind = 1;
  string subject = 2;
  string ip_address = 3;
  int32 severity = 4;
  map<string, string> details = 5;
  string idempotency_key = 6; // los umbrales de bloqueo cuentan eventos: un reintento no debe sumar dos
}
message ReportSecurityEventResponse { bool blocked = 1; }
message IsBlockedRequest { string subject = 1; string ip_address = 2; }
message IsBlockedResponse { bool blocked = 1; string reason = 2; google.protobuf.Timestamp until = 3; }

message IssueServiceCertificateRequest { string service_name = 1; bytes csr_pem = 2; string bootstrap_token = 3; 
  string idempotency_key = 4;}
message ServiceCertificate { bytes certificate_pem = 1; bytes ca_bundle_pem = 2; google.protobuf.Timestamp expires_at = 3; }

// ── Eventos. ──
// Auditoría asíncrona: CUALQUIER contenedor escribe este mensaje en su outbox en la misma transacción
// que la acción auditada (atomicidad) con subject pp.audit.<contenedor>.recorded.v1; security lo consume
// y lo encadena (hash chain) en el registro append-only. AppendAuditEvent (gRPC) queda para el gateway
// y para acciones sin transacción local. Ver docs/standards/security-standards.md §12.
message AuditRecorded { AuditEvent event = 1; }
