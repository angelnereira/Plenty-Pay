# PlentyPay — sistema local (ADR 0006). Reglas: docs/standards/delivery-pipeline.md §5.
# Hoy: identity + api-gateway + web (implementados) y el stack de observabilidad (F04).
# Solo se publican api-gateway (8080) y web (8081). Contexto de build SIEMPRE ./<contenedor> (check-isolation.sh).

name: plentypay

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Salud contra :9100/healthz/ready con el subcomando del propio binario (imágenes distroless sin shell).
x-healthcheck: &healthcheck
  test: ["CMD", "/app", "healthcheck"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s
  start_interval: 1s

services:
  identity:
    <<: *hardening
    build:
      context: ./identity
    env_file: ./identity/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # F08.2: DSN del store sobre postgres-db (rol identity_svc por PgBouncer).
      # El valor por defecto apunta al PgBouncer local; vacío = store en memoria.
      PP_DB_DSN: "${IDENTITY_DB_DSN:-postgres://identity_svc:identity_svc_dev_secret_32_chars!@pgbouncer:6432/plentypay?sslmode=disable}"
      # El job de migracion conecta directo a postgres-db:5432 (lib/pq de
      # golang-migrate envia parametros que PgBouncer en transaccion rechaza).
      PP_MIGRATE_DSN: "${IDENTITY_MIGRATE_DSN:-postgres://migrator_identity:identity_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      # Reporte de TOKEN_REUSE a security (R8). Vacio = no reporta.
      PP_SECURITY_ADDR: "${IDENTITY_SECURITY_ADDR:-security:50073}"
      PP_SECURITY_INSECURE: "true"
      # Relay del outbox (F08.5, ADR 0012): publica TenantStatusChanged en NATS.
      PP_NATS_URL: "${IDENTITY_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${IDENTITY_NATS_USER:-identity_svc}"
      PP_NATS_PASS: "${IDENTITY_NATS_PASS:-identity_nats_secret}"
    networks: [services, data]
    healthcheck: *healthcheck
    depends_on:
      pgbouncer:
        condition: service_healthy

  # F10: libro contable (Rust). Solo payments-core y settlement escriben (SPEC §4); hoja sin
  # dependencias gRPC. Conecta directo a postgres-db: sqlx usa sentencias preparadas y PgBouncer
  # está en modo transaction sin max_prepared_statements. Migraciones: `docker compose run --rm ledger migrate`.
  ledger:
    <<: *hardening
    build:
      context: ./ledger
    environment:
      DATABASE_URL: "${LEDGER_DB_DSN:-postgres://ledger_svc:ledger_svc_dev_secret_32_chars!@postgres-db:5432/plentypay?sslmode=disable}"
      PP_MIGRATE_DSN: "${LEDGER_MIGRATE_DSN:-postgres://migrator_ledger:ledger_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      PP_NATS_URL: "${LEDGER_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${LEDGER_NATS_USER:-ledger_svc}"
      PP_NATS_PASS: "${LEDGER_NATS_PASS:-ledger_nats_secret}"
      RUST_LOG: "${LEDGER_LOG:-info}"
    networks: [services, data]
    healthcheck: *healthcheck
    depends_on:
      postgres-db:
        condition: service_healthy

  # F11: orquestador de cobros (Rust). Único que pide al ledger asientos de cobro (AGENTS.md §2.5).
  # Conecta directo a postgres-db (sqlx con sentencias preparadas). Límites, umbral de step-up y
  # flags vienen de infra-management; estado del negocio de identity. Migraciones:
  # `docker compose run --rm --no-deps payments-core migrate`.
  payments-core:
    <<: *hardening
    build:
      context: ./payments-core
    environment:
      DATABASE_URL: "${PAYMENTS_DB_DSN:-postgres://payments_svc:payments_svc_dev_secret_32_chars!@postgres-db:5432/plentypay?sslmode=disable}"
      PP_MIGRATE_DSN: "${PAYMENTS_MIGRATE_DSN:-postgres://migrator_payments:payments_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      PP_LEDGER_ADDR: "http://ledger:50061"
      PP_IDENTITY_ADDR: "http://identity:50060"
      PP_INFRA_ADDR: "http://infra-management:50074"
      PP_NATS_URL: "${PAYMENTS_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${PAYMENTS_NATS_USER:-payments_svc}"
      PP_NATS_PASS: "${PAYMENTS_NATS_PASS:-payments_nats_secret}"
      RUST_LOG: "${PAYMENTS_LOG:-info}"
    networks: [services, data]
    healthcheck: *healthcheck
    depends_on:
      postgres-db:
        condition: service_healthy
      ledger:
        condition: service_healthy

  # F15–F17: comercio. catalog (productos), inventory (existencias) y pos (caja). Cada uno
  # migra con `docker compose run --rm <svc> migrate` (conexión directa) y sirve por PgBouncer.
  catalog:
    <<: *hardening
    build:
      context: ./catalog
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      PP_DB_DSN: "${CATALOG_DB_DSN:-postgres://catalog_svc:catalog_svc_dev_secret_32_chars!@pgbouncer:6432/plentypay?sslmode=disable}"
      PP_MIGRATE_DSN: "${CATALOG_MIGRATE_DSN:-postgres://migrator_catalog:catalog_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      PP_INFRA_ADDR: "infra-management:50074"
      PP_IDENTITY_ADDR: "identity:50060"
      PP_NATS_URL: "${CATALOG_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${CATALOG_NATS_USER:-catalog_svc}"
      PP_NATS_PASS: "${CATALOG_NATS_PASS:-catalog_nats_secret}"
    networks: [services, data]
    healthcheck: *healthcheck
    depends_on:
      pgbouncer:
        condition: service_healthy

  inventory:
    <<: *hardening
    build:
      context: ./inventory
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      PP_DB_DSN: "${INVENTORY_DB_DSN:-postgres://inventory_svc:inventory_svc_dev_secret_32_chars!@pgbouncer:6432/plentypay?sslmode=disable}"
      PP_MIGRATE_DSN: "${INVENTORY_MIGRATE_DSN:-postgres://migrator_inventory:inventory_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      PP_CATALOG_ADDR: "catalog:50065"
      PP_NATS_URL: "${INVENTORY_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${INVENTORY_NATS_USER:-inventory_svc}"
      PP_NATS_PASS: "${INVENTORY_NATS_PASS:-inventory_nats_secret}"
    networks: [services, data]
    healthcheck: *healthcheck
    depends_on:
      pgbouncer:
        condition: service_healthy

  # F13: facturación electrónica DGI (fiscal-invoicing/SPEC.md). DEMO usa el PAC simulado (R9).
  # Migra con `docker compose run --rm --no-deps fiscal-invoicing migrate`.
  fiscal-invoicing:
    <<: *hardening
    build:
      context: ./fiscal-invoicing
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      PORT: "50064"
      PP_DB_DSN: "${FISCAL_DB_DSN:-postgres://fiscal_svc:fiscal_svc_dev_secret_32_chars!@pgbouncer:6432/plentypay?sslmode=disable}"
      PP_MIGRATE_DSN: "${FISCAL_MIGRATE_DSN:-postgres://migrator_fiscal:fiscal_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      PP_IDENTITY_ADDR: "identity:50060"
      PP_SECURITY_ADDR: "security:50073"
      PP_INFRA_ADDR: "infra-management:50074"
      PP_NATS_URL: "${FISCAL_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${FISCAL_NATS_USER:-fiscal_svc}"
      PP_NATS_PASS: "${FISCAL_NATS_PASS:-fiscal_nats_secret}"
      # ADR 0022: PROD del PAC solo tras la validación legal (F30.3).
      FISCAL_PROD_ENABLED: "${FISCAL_PROD_ENABLED:-false}"
      # Adaptadores de PAC ofrecidos, en orden (ADR 0022); cada uno se configura con PP_PAC_<ID>_*.
      PP_PAC_PROVIDERS: "${FISCAL_PAC_PROVIDERS:-simulator,hka}"
    # pac-egress: única salida a internet de un servicio interno, para llegar al PAC por HTTPS.
    networks: [services, data, pac-egress]
    healthcheck: *healthcheck
    depends_on:
      pgbouncer:
        condition: service_healthy

  pos:
    <<: *hardening
    build:
      context: ./pos
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      PP_DB_DSN: "${POS_DB_DSN:-postgres://pos_svc:pos_svc_dev_secret_32_chars!@pgbouncer:6432/plentypay?sslmode=disable}"
      PP_MIGRATE_DSN: "${POS_MIGRATE_DSN:-postgres://migrator_pos:pos_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      PP_CATALOG_ADDR: "catalog:50065"
      PP_INVENTORY_ADDR: "inventory:50066"
      PP_NATS_URL: "${POS_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${POS_NATS_USER:-pos_svc}"
      PP_NATS_PASS: "${POS_NATS_PASS:-pos_nats_secret}"
    networks: [services, data]
    healthcheck: *healthcheck
    depends_on:
      pgbouncer:
        condition: service_healthy

  # F15.6–F15.9: pedidos del marketplace (saga: reservas en inventory + UN cobro con splits).
  orders:
    <<: *hardening
    build:
      context: ./orders
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      PP_DB_DSN: "${ORDERS_DB_DSN:-postgres://orders_svc:orders_svc_dev_secret_32_chars!@pgbouncer:6432/plentypay?sslmode=disable}"
      PP_MIGRATE_DSN: "${ORDERS_MIGRATE_DSN:-postgres://migrator_orders:orders_svc_dev_secret_32_chars!_mig@postgres-db:5432/plentypay?sslmode=disable}"
      PP_CATALOG_ADDR: "catalog:50065"
      PP_INVENTORY_ADDR: "inventory:50066"
      PP_PAYMENTS_ADDR: "payments-core:50062"
      PP_NATS_URL: "${ORDERS_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${ORDERS_NATS_USER:-orders_svc}"
      PP_NATS_PASS: "${ORDERS_NATS_PASS:-orders_nats_secret}"
    networks: [services, data]
    healthcheck: *healthcheck
    depends_on:
      pgbouncer:
        condition: service_healthy

  api-gateway:
    <<: *hardening
    build:
      context: ./api-gateway
    env_file: ./api-gateway/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # Consumidor de SessionRevoked para el WebSocket (F09.5). Vacio = sin cierre remoto.
      PP_NATS_URL: "${GATEWAY_NATS_URL:-nats://event-bus:4222}"
      PP_NATS_USER: "${GATEWAY_NATS_USER:-gateway_svc}"
      PP_NATS_PASS: "${GATEWAY_NATS_PASS:-gateway_nats_secret}"
      WEB_SERVICE_URL: "http://web:8081"
      S3_ENDPOINT: "http://object-storage:3900"
      S3_REGION: "garage"
      # S3_KEY_ID y S3_SECRET_KEY (llave catalog_svc, solo pp-catalog-media) vienen de api-gateway/.env.
      S3_MEDIA_BUCKET: "pp-catalog-media"
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_healthy
      web:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    networks: [edge, services]
    healthcheck: *healthcheck

  # F02.8: sirve la app Flutter Web. El bundle lo construye ./scripts/build-release.sh web
  # y se monta en solo lectura; sin él, `web` responde página de mantenimiento (SPEC R4).
  # El bundle va en /static/app porque /app es el binario del contenedor.
  web:
    <<: *hardening
    build:
      context: ./web
    env_file: ./web/.env
    environment:
      WEB_APP_DIR: /static/app
      WEB_STATIC_DIR: /static
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./web/static/app:/static/app:ro
    # `edge` para servir al cliente y `services` para que el stack de observabilidad pueda
    # scrapear su :9100 (SPEC §2: "puerto admin en todos los servicios propios").
    networks: [edge, services]
    healthcheck: *healthcheck

  # Exposición a internet mediante Cloudflare Tunnel para pruebas móviles remotas
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://api-gateway:8080
    restart: unless-stopped
    networks: [edge]
    depends_on:
      api-gateway:
        condition: service_healthy

  # ── Seguridad base (F05) ──────────────────────────────────────────────────────
  openbao:
    <<: *hardening
    user: "100:1000"
    image: openbao/openbao@sha256:19612d67a4a95d05a7b77c6ebc6c2ac5dac67a8712d8df2e4c31ad28bee7edaa # 2.2.0
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:-plentypay-dev-root-token}
      - -dev-no-store-token
    tmpfs: [/tmp:rw]
    networks: [data]
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  security:
    <<: *hardening
    build:
      context: ./security
    env_file: ./security/.env
    environment:
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-plentypay-dev-root-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      openbao:
        condition: service_healthy
    networks: [services, data]
    healthcheck: *healthcheck

  infra-management:
    <<: *hardening
    build:
      context: ./infra-management
    env_file: ./infra-management/.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    networks: [services]
    healthcheck: *healthcheck

  # ── PostgreSQL de producción (F06) ───────────────────────────────────────────
  postgres-db:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./postgres-db
    env_file: ./postgres-db/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal:/var/lib/postgresql/wal_archive
      - postgres-backup:/var/lib/postgresql/backup
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plentypay"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  pgbouncer:
    restart: unless-stopped
    build:
      context: ./postgres-db
      dockerfile: pgbouncer/Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_master_password_32ch}
      READONLY_OPS_PASSWORD: ${READONLY_OPS_PASSWORD:-readonly_ops_dev_pass}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks: [services, data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres -d plentypay"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter@sha256:6999a7657e2f2fb0ca6ebf417213eebf6dc7d21b30708c622f6fcb11183a2bb0 # v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://readonly_ops:${READONLY_OPS_PASSWORD:-readonly_ops_dev_pass}@postgres-db:5432/plentypay?sslmode=disable
    depends_on:
      postgres-db:
        condition: service_healthy
    networks: [services, data]

  # ── NoSQL (F07) ─────────────────────────────────────────────────────────────
  nosql-db:
    restart: unless-stopped
    build:
      context: ./nosql-db
    volumes:
      - scylla-data:/var/lib/scylla
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'DESCRIBE KEYSPACES;' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s


  # ── Bus de eventos (F07) ─────────────────────────────────────────────────────
  event-bus:
    restart: unless-stopped
    build:
      context: ./event-bus
    volumes:
      - nats-data:/data/jetstream
    networks: [services, data]
    healthcheck:
      test: ["CMD-SHELL", "nats rtt -s localhost:4222 --user admin --password admin_nats_secret || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nats-exporter:
    <<: *hardening
    image: natsio/prometheus-nats-exporter@sha256:c623b608e148e31e1c1c878673a197f1828e58ce90de4f01d22f1baa84c8fee9
    command: ["-varz", "-connz", "-subz", "-jsz=all", "http://event-bus:8222"]
    depends_on:
      event-bus:
        condition: service_healthy
    networks: [services, data]

  # ── Almacenamiento de objetos (F07) ────────────────────────────────────────────
  # Secretos de desarrollo por entorno; en producción los inyecta OpenBao (F28.4).
  object-storage:
    <<: *hardening
    build:
      context: ./object-storage
    # GARAGE_RPC_SECRET (64 hex) y GARAGE_ADMIN_TOKEN salen de object-storage/.env, que no se
    # versiona (AGENTS.md §2.10; object-storage/.env.example). En producción, OpenBao (F28.4).
    env_file: ./object-storage/.env
    volumes:
      - garage-data:/var/lib/garage
    # Solo desde esta máquina: la API S3 y la de administración no se publican en la red; las
    # apps llegan a las fotos por el gateway (ADR 0021).
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    networks: [edge, services, data]
    # Salud del clúster vía CLI oficial (la API S3 responde 403 a anónimos: no sirve
    # como healthcheck). La prueba L2 verifica que la API S3 responda (criterio F07.8).
    healthcheck:
      test: ["CMD", "/usr/local/bin/garage", "health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  # ── Observabilidad (F04) ────────────────────────────────────────────────────────
  # Imágenes fijadas por digest (SPEC §2): una actualización es un cambio de commit.
  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6 # 0.162.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
    networks: [services]

  prometheus:
    <<: *hardening
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e # 3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks: [services, data]

  loki:
    <<: *hardening
    image: grafana/loki@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193 # 3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    tmpfs: [/tmp:rw]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [services]

  tempo:
    <<: *hardening
    image: grafana/tempo@sha256:1ce31d6d7ffab62189685e8c47881d4a561c5d38bd0dbd66e40ca83cef07923d # 3.0.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    tmpfs: [/tmp:rw]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks: [services]

  alloy:
    <<: *hardening
    image: grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f # 1.20.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/alloy-data"]
    tmpfs: [/tmp:rw]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/alloy-data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [services]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8 # v0.28.0
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    tmpfs: [/tmp:rw]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    networks: [services]

  grafana:
    <<: *hardening
    image: grafana/grafana-oss@sha256:163be84f32fdf9d204c6b8b2f2cccb04628baa365cf973eb1c32d1faaa8fbfc3 # 11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs: [/tmp:rw]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [services]

  # --- Plantilla para nuevos contenedores (descomentar al llegar a su fase) ---
  # <contenedor>:
  #   <<: *hardening
  #   build:
  #     context: ./<contenedor>
  #   env_file: ./<contenedor>/.env
  #   networks: [services, data]          # data solo si usa postgres/nosql/bus/objetos
  #   healthcheck: *healthcheck

networks:
  edge: {}
  services:
    internal: true
  data:
    internal: true
  # Salida a internet solo para fiscal-invoicing → PAC (ADR 0022). Pendiente: limitarla a los
  # dominios del PAC con un proxy de salida.
  pac-egress: {}

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  alertmanager-data:
  grafana-data:
  postgres-data:
  postgres-wal:
  postgres-backup:
  scylla-data:
  nats-data:
  garage-data:
