# PlentyPay — sistema local (ADR 0006). Reglas: docs/standards/delivery-pipeline.md §5.
# Hoy: identity + api-gateway (implementados). Cada fase agrega su bloque copiando la plantilla del final.
# Solo se publican api-gateway (8080) y web (8081). Contexto de build SIEMPRE ./<contenedor> (check-isolation.sh).

name: plentypay

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Salud contra :9100/healthz/ready con el subcomando del propio binario (imágenes distroless sin shell).
x-healthcheck: &healthcheck
  test: ["CMD", "/app", "healthcheck"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s
  start_interval: 1s

services:
  identity:
    <<: *hardening
    build:
      context: ./identity
    env_file: ./identity/.env
    networks: [services]
    healthcheck: *healthcheck

  api-gateway:
    <<: *hardening
    build:
      context: ./api-gateway
    env_file: ./api-gateway/.env
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_healthy
    networks: [edge, services]
    healthcheck: *healthcheck

  # F02.8: sirve la app Flutter Web. El bundle lo construye ./scripts/build-release.sh web
  # y se monta en solo lectura; sin él, `web` responde página de mantenimiento (SPEC R4).
  web:
    <<: *hardening
    build:
      context: ./web
    env_file: ./web/.env
    ports:
      - "8081:8081"
    volumes:
      - ./web/static/app:/app/static/app:ro
    networks: [edge]
    healthcheck: *healthcheck

  # F04.1: colector OTLP (4317/4318), Prometheus (9090) y scrape de los :9100/metrics de
  # los servicios. Tempo/Loki/Grafana/Alertmanager llegan en F04.2–F04.5.
  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:latest # la versión exacta se fija al cerrar F04
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
    networks: [services]

  prometheus:
    <<: *hardening
    image: prom/prometheus:latest # ídem
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
    networks: [services]

  # --- Plantilla para nuevos contenedores (descomentar al llegar a su fase) ---
  # <contenedor>:
  #   <<: *hardening
  #   build:
  #     context: ./<contenedor>
  #   env_file: ./<contenedor>/.env
  #   networks: [services, data]          # data solo si usa postgres/nosql/bus/objetos
  #   healthcheck: *healthcheck
  #   depends_on:
  #     postgres-db: { condition: service_healthy }

networks:
  edge: {}
  services:
    internal: true
  data:
    internal: true
