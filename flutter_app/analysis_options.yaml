include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: error
    empty_catches: error
    unawaited_futures: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - always_declare_return_types
    # observability-standards.md §14: ningún fallo se descarta en silencio
    - empty_catches
    - unawaited_futures
