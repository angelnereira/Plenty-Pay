publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Esqueleto mínimo (F02). Paquetes aprobados completos: docs/standards/flutter-standards.md §2.
# F02.3–F02.5 agregan riverpod, go_router, dio, freezed, drift, intl, etc.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
