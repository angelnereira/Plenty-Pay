name: plentypay
description: PlentyPay — app única multiplataforma (Android, iOS, Linux, Windows, macOS, Web). ADR 0009.
publish_to: "none"
version: 0.13.0+25

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Esqueleto mínimo (F02). Paquetes aprobados completos: docs/standards/flutter-standards.md §2.
# F02.3–F02.5 agregan riverpod, go_router, dio, freezed, drift, intl, etc.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  dio: ^5.11.1
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
