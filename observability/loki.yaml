# Loki — retención y almacenamiento local (F04.2).
# Recibe los logs que el colector reenvía por OTLP y los que Alloy lee de los
# contenedores de Docker. Retención 30 días (observability/SPEC.md R2).
#
# Referencias: observability/SPEC.md §3, docs/standards/observability-standards.md §5.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Un único flujo de ingesta: todo lo que llega se indexa por las etiquetas que pone
# el colector (service, env, level). NUNCA se indexa por request_id ni por usuario.
schema_config:
  configs:
    - from: 2026-10-13
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # §2.3 aplicado a los logs: nada de etiquetas de alta cardinalidad.
  allow_structured_metadata: true
  max_label_names_per_series: 15
  retention_period: 720h # 30 días
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

query_range:
  parallelise_shardable_queries: true

analytics:
  reporting_enabled: false
