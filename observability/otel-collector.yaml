# OpenTelemetry Collector — configuración como código (F04.1).
# Recibe OTLP de todos los contenedores (4317 gRPC / 4318 HTTP), aplica tail sampling
# (100 % de trazas con error o latencia alta, 10 % del resto — observability-standards.md §3.4)
# y exporta métricas y trazas. Los logs van por el puente OTLP de cada servicio (F04.2).
#
# Referencias: docs/standards/observability-standards.md §3, §5; observability/SPEC.md §3.
# Versión de la imagen: la fija observability/SPEC.md §2 al cerrar F04 (pendiente).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Lotes acotados: si el exportador se atasca, el buffer crece y se descarta (nunca bloquea el servicio).
  batch:
    timeout: 5s
    send_batch_size: 8192

  # Atributos que faltan en los recursos de los servicios (el resto los pone cada contenedor).
  resource:
    attributes:
      - key: deployment.environment.name
        from_attribute: ""
        action: upsert
        value: ${env:DEPLOY_ENV}

  # Muestreo de cola. `num_traces` debe cubrir el tráfico esperado del entorno local.
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      # §3.4: 100 % de las trazas con error o latencia por encima de p99.
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  # Trazas → Tempo (F04.3).
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

  # Métricas → Prometheus (F04.1). El contenedor del colector expone :8889 en la misma red.
  # SIN `namespace`: las series ya nacen con el prefijo `pp_` (§2) y un namespace aquí las
  # duplicaría (`pp_pp_http_requests_total`).
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Logs → Loki (F04.2). Los servicios pueden enviarlos por OTLP además de escribirlos en stdout.
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      service: true
      level: true
    labels:
      resource:
        service.name: service
        deployment.environment.name: env

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
  # Memoria acotada: el colectar cae antes que el servicio que lo llama.
  memory_ballast:
    size_in_mib: 64

service:
  extensions: [health_check, zpages, memory_ballast]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_ballast, batch, tail_sampling]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]
