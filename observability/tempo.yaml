# Tempo — trazabilidad distribuida (F04.3).
# Recibe las trazas del colector (OTLP 4317) y las guarda 7 días (SPEC R2).
# La propagación W3C `traceparent` ya funciona de extremo a extremo: el E2E
# comprueba que gateway e identity comparten trace_id y request_id.
#
# Referencias: observability/SPEC.md §3, observability-standards.md §3.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 168h # 7 días

storage:
  trace:
    backend: local
    wal:
      path: /tempo/wal
    local:
      path: /tempo/blocks
    pool:
      max_workers: 20
      queue_depth: 200

# §3.3: los atributos útiles para buscar una traza concreta. No se indexan montos
# ni datos personales (las trazas pueden llevarlos, los índices no).
search_enabled: true
metrics_generator_enabled: false

overrides:
  defaults:
    metrics_generator:
      processors: []

usage_report:
  reporting_enabled: false
