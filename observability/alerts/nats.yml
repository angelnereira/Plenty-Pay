# Reglas de alerta para NATS JetStream (F07.7)
# SPEC: event-bus/SPEC.md §4 R2, docs/standards/events-and-messaging.md §5
groups:
  - name: criticas-nats
    rules:
      - alert: NatsDown
        expr: up{job="nats"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NATS Event Bus no responde"
          description: "El exporter de NATS (nats-exporter:7777) no responde a las consultas de Prometheus."
          runbook_url: "https://docs.plentypay.local/runbooks/nats-down.md"

      - alert: NatsDLQMessagesDetected
        expr: jetstream_stream_total_messages{stream_name="PP_DLQ"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Mensajes detectados en Dead Letter Queue (DLQ)"
          description: "Se han detectado {{ $value }} mensajes no procesables en el stream PP_DLQ. Requiere inspección y reproceso."
          runbook_url: "https://docs.plentypay.local/runbooks/nats-dlq.md"

  - name: advertencias-nats
    rules:
      - alert: NatsConsumerLagHigh
        expr: jetstream_consumer_num_pending > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Lag elevado en consumidor JetStream"
          description: "El consumidor {{ $labels.consumer_name }} en el stream {{ $labels.stream_name }} tiene {{ $value }} mensajes pendientes."
          runbook_url: "https://docs.plentypay.local/runbooks/nats-lag.md"

      - alert: NatsSlowConsumers
        expr: gnatsd_varz_slow_consumers > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Consumidores lentos detectados en NATS"
          description: "NATS registra {{ $value }} consumidores lentos descartando o acumulando buffers."
          runbook_url: "https://docs.plentypay.local/runbooks/nats-slow-consumers.md"
